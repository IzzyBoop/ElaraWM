[workspace]
resolver = "2"
members = [
    "crates/elara",
    "crates/elara-compat",
    "crates/elara-layout",
    "crates/elara-macos",
    "crates/niri-config",
    "crates/niri-ipc",
]

[workspace.package]
version = "0.1.0"
description = "A scrollable-tiling window manager for macOS, ported from niri"
authors = ["IzzyBoop", "Ivan Molodetskikh <yalterz@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/niri-wm/niri"

[workspace.dependencies]
anyhow = "1.0.102"
bitflags = "2.11.1"
clap = { version = "4.6.1", features = ["derive"] }
insta = "1.47.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = { version = "0.1.44", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracy-client = { version = "0.18.4", default-features = false }

# ELARA: upstream points this at Smithay's git repository. Here it is the local stand-in, whose
# library target is named `smithay`.
[workspace.dependencies.smithay]
package = "elara-compat"
path = "crates/elara-compat"

[profile.release]
debug = "line-tables-only"
overflow-checks = true
lto = "thin"
