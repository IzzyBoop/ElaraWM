[package]
name = "elara-compat"
version.workspace = true
description = "Stand-ins for the Smithay types that niri's code expects, for use on macOS"
authors.workspace = true
# Files copied from Smithay are MIT (see LICENSE-SMITHAY.txt); the rest is GPL-3.0-or-later.
license = "GPL-3.0-or-later AND MIT"
# Smithay uses the 2024 edition; matching it keeps the copied files verbatim.
edition = "2024"
rust-version.workspace = true

[lib]
# The library is named after the crate it stands in for, so imported niri files and copied
# Smithay doctests keep their `smithay::` paths.
name = "smithay"

[dependencies]
# No-op unless a profiler backend feature is enabled; used by the copied Smithay output code.
profiling = "1.0.13"
rustix = { version = "1.0.7", features = ["time"] }
thiserror = "2.0.12"
tracing.workspace = true
xkeysym = "0.2.1"

[lints.rust]
# Copied Smithay files gate their Wayland and DRM parts behind these features, which this crate
# never defines. Declaring them here keeps the files verbatim without warnings.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("wayland_frontend", "xwayland", "backend_drm"))',
] }
